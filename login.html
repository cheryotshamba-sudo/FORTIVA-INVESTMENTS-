<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortiva Capital - Login</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #006b3f;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #006b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .register a {
      color: #006b3f;
      font-weight: bold;
      text-decoration: none;
    }
  </style></head><body>  <div class="login-container"><h1>Welcome Back</h1>

<p class="subtitle">
  Login to your Fortiva Capital account
</p>

<form id="loginForm">

  <label for="identifier">
    Phone Number or Email
  </label>

  <input
    type="text"
    id="identifier"
    placeholder="Enter phone number or email"
    autocomplete="username"
    required
  >

  <label for="password">
    Password
  </label>

  <input
    type="password"
    id="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
  >

  <button type="submit" id="loginButton">
    Login
  </button>

</form>

<div class="message" id="message"></div>

<div class="register">
  Don't have an account?
  <a href="register.html">Create Account</a>
</div>

  </div>  <script>

    const BACKEND_URL =
      "https://fortiva-backend-hvqy.onrender.com";

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const identifier =
          document
            .getElementById("identifier")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        message.style.display =
          "none";

        message.textContent =
          "";


        loginButton.disabled =
          true;

        loginButton.textContent =
          "Logging in...";


        try {

          const response =
            await fetch(
              `${BACKEND_URL}/api/login`,
              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/json"

                },

                body:
                  JSON.stringify({

                    identifier:
                      identifier,

                    password:
                      password

                  })

              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Login failed"
            );

          }


          /*
            Save the JWT using the exact key
            expected by deposit.html.
          */

          localStorage.setItem(
            "token",
            data.token
          );


          localStorage.setItem(
            "fortivaToken",
            data.token
          );


          localStorage.setItem(
            "fortivaUser",
            JSON.stringify(
              data.user
            )
          );


          message.style.display =
            "block";

          message.style.color =
            "#006b3f";

          message.textContent =
            "Login successful.";


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 500);


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          message.style.display =
            "block";

          message.style.color =
            "#d00000";

          message.textContent =
            error.message ||
            "Unable to connect to the login server.";


        } finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login";

        }

      }
    );

  </script></body>
</html>
