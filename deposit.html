<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortiva Capital - Deposit</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: white;
    }

    .topbar {
      height: 78px;
      background: #10233d;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 30px;
      margin-right: 25px;
    }

    .title {
      font-size: 21px;
      font-weight: bold;
    }

    .main {
      padding: 30px 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #10233d;
      padding: 25px;
      border-radius: 20px;
    }

    input,
    select {
      width: 100%;
      height: 52px;
      margin: 10px 0 20px;
      padding: 0 12px;
      box-sizing: border-box;
      background: #091a2f;
      color: white;
      border: 1px solid #31537e;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      height: 55px;
      background: #2e68e8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #0b2a20;
      color: #9ce5c9;
      display: none;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a class="back" href="dashboard.html">‹</a>
    <div class="title">Deposit Funds</div>
  </div>

  <div class="main">

    <div class="card">

      <h1>Deposit Funds</h1>

      <p>Enter your deposit details.</p>

      <label>Amount (KES)</label>

      <input
        id="amount"
        type="number"
        placeholder="Enter amount"
      >

      <label>M-Pesa Phone Number</label>

      <input
        id="phone"
        type="tel"
        placeholder="07XXXXXXXX"
      >

      <button
        type="button"
        onclick="testButton()">
        Deposit Funds
      </button>

      <div id="result">
        BUTTON IS WORKING
      </div>

    </div>

  </div>

  <script>

    function testButton() {

      document.getElementById("result").style.display = "block";

      document.getElementById("result").textContent =
        "BUTTON IS WORKING";

    }

  </script>

</body>
</html>
