        id="phone"
        type="tel"
        placeholder="07XXXXXXXX"
      >

      <button
        type="button"
        onclick="testButton()">
        Deposit Funds
      </button>

      <div id="result">
        BUTTON IS WORKING
      </div>

      document.getElementById("result").style.display = "block";

      document.getElementById("result").textContent =

    }

  </script>

</body>
</html>
